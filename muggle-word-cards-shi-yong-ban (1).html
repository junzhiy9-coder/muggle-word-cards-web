<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="data:," />
    <title>Muggle Word Cards 试用版</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&display=swap" rel="stylesheet" />
    <style>
      /* ===== Palette & base — copied from the main Muggle Word Cards (theme.css) ===== */
      :root {
        color-scheme: light dark;
        --bg: #f4f2ec;
        --surface: #ffffff;
        --surface-2: #efece3;
        --text: #23201a;
        --ink: #23201a;
        --ink-soft: #5d574c;
        --dim: #5d574c;
        --ink-faint: #8a8375;
        --border: #ddd6c6;
        --line: #ddd6c6;
        --accent: #b3382c;
        --accent-ink: #ffffff;
        --good: #2e7d4f;
        --good-bg: #e5f1e9;
        --bad: #b3382c;
        --bad-bg: #f8e8e5;
        --gold: #9a6b1f;
        --gold-bg: #f6ecd4;
        --shadow: 0 10px 30px rgba(35, 32, 26, 0.10), 0 2px 6px rgba(35, 32, 26, 0.06);
        --radius: 18px;
        --glass-hi: rgba(255, 255, 255, 0.85);
        --glass-shadow: rgba(35, 32, 26, 0.20);
        --glass-shadow-soft: rgba(35, 32, 26, 0.10);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #17150f;
          --surface: #242119;
          --surface-2: #2c291f;
          --text: #ece7da;
          --ink: #ece7da;
          --ink-soft: #b3ac9c;
          --dim: #b3ac9c;
          --ink-faint: #857e6e;
          --border: #3a362a;
          --line: #3a362a;
          --accent: #e0685a;
          --accent-ink: #1c1712;
          --good: #7cc79b;
          --good-bg: #1e3226;
          --bad: #e0685a;
          --bad-bg: #3a211d;
          --gold: #d9ab4e;
          --gold-bg: #38300f;
          --shadow: 0 10px 30px rgba(0, 0, 0, 0.45), 0 2px 6px rgba(0, 0, 0, 0.3);
          --glass-hi: rgba(255, 255, 255, 0.30);
          --glass-shadow: rgba(0, 0, 0, 0.55);
          --glass-shadow-soft: rgba(0, 0, 0, 0.35);
        }
      }
      * { box-sizing: border-box; }
      html { -webkit-text-size-adjust: 100%; }
      body { margin: 0; background: var(--bg); color: var(--ink); }
      button { font: inherit; }

      /* ===== App styles — ported verbatim from the main version ===== */
      .mwc-wrap {
        max-width: 680px;
        margin: 0 auto;
        padding: 20px 16px 48px;
        color: var(--ink);
        font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
        -webkit-font-smoothing: antialiased;
        line-height: 1.5;
      }
      .mwc-wrap header.top { margin-bottom: 14px; }
      .mwc-wrap header.top h1 {
        font-family: "Playfair Display", Georgia, "Times New Roman", serif;
        font-size: 26px;
        font-weight: 900;
        margin: 0 0 4px;
        letter-spacing: 0.02em;
      }
      .mwc-wrap header.top p { margin: 0; color: var(--ink-soft); font-size: 13.5px; }

      .progress-block {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        padding: 14px 16px;
        margin-bottom: 12px;
      }
      .progress-nums {
        display: flex;
        flex-wrap: wrap;
        gap: 6px 18px;
        font-size: 14px;
        color: var(--ink-soft);
        margin-bottom: 10px;
      }
      .progress-nums b { color: var(--ink); font-size: 16px; }
      .progress-nums .know b { color: var(--good); }
      .progress-nums .unknow b { color: var(--bad); }
      .progress-nums .due b { color: var(--accent); }
      .bar {
        height: 8px;
        border-radius: 99px;
        background: var(--surface-2);
        overflow: hidden;
        display: flex;
      }
      .bar .seg-know { background: var(--good); height: 100%; transition: width .35s ease; }
      .bar .seg-unknow { background: var(--bad); height: 100%; transition: width .35s ease; }

      .mode-switch { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
      .mode-switch button {
        appearance: none;
        border: 1px solid var(--line);
        background: var(--surface);
        color: var(--ink-soft);
        font: inherit;
        font-size: 15px;
        font-weight: 600;
        padding: 11px 10px;
        border-radius: 12px;
        cursor: pointer;
      }
      .mode-switch button.active { background: var(--ink); color: var(--bg); border-color: var(--ink); }

      .src-select { position: relative; margin-bottom: 14px; }
      .src-trigger {
        appearance: none;
        font: inherit;
        width: 100%;
        display: flex;
        align-items: center;
        gap: 5px;
        padding: 11px 14px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: var(--surface);
        color: var(--ink);
        font-size: 15px;
        font-weight: 600;
        text-align: left;
        cursor: pointer;
        transition: transform .15s ease;
      }
      .src-trigger:active { transform: scale(.99); }
      .src-trigger-cnt { color: var(--ink-soft); font-weight: 500; }
      .src-trigger .chev {
        margin-left: auto;
        flex: none;
        color: var(--ink-soft);
        transition: transform .2s ease;
      }
      .src-trigger .chev.open { transform: rotate(180deg); }
      .src-menu {
        position: absolute;
        left: 0;
        right: 0;
        top: calc(100% + 6px);
        z-index: 40;
        padding: 6px;
        border: 1px solid var(--line);
        border-radius: 14px;
        background: var(--surface);
        box-shadow: 0 14px 34px rgba(0, 0, 0, .16);
        max-height: 46vh;
        overflow-y: auto;
        animation: src-menu-in .16s ease;
      }
      @keyframes src-menu-in {
        from { opacity: 0; transform: translateY(-4px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .src-opt {
        appearance: none;
        font: inherit;
        width: 100%;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px 12px;
        border: none;
        border-radius: 9px;
        background: transparent;
        color: var(--ink);
        font-size: 14.5px;
        text-align: left;
        cursor: pointer;
      }
      .src-opt .cnt { margin-left: auto; font-size: 12.5px; color: var(--ink-soft); }
      .src-opt:active { background: color-mix(in srgb, var(--ink) 6%, transparent); }
      .src-opt.selected {
        background: var(--accent);
        box-shadow:
          0 4px 10px color-mix(in srgb, var(--accent) 24%, transparent),
          inset 0 1px 0 rgba(255, 255, 255, .28),
          inset 0 -2px 0 rgba(0, 0, 0, .14);
        color: var(--accent-ink);
        font-weight: 600;
      }
      .src-opt.selected .cnt { color: inherit; opacity: .75; }
      @media (prefers-reduced-motion: reduce) {
        .src-menu { animation: none; }
        .src-trigger .chev { transition: none; }
      }

      .collections {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 8px;
        margin-bottom: 10px;
      }
      @media (min-width: 560px) {
        .collections { grid-template-columns: repeat(4, 1fr); }
      }
      .col-tile {
        appearance: none;
        font: inherit;
        text-align: left;
        display: flex;
        flex-direction: column;
        gap: 2px;
        padding: 12px 14px;
        border: 1px solid var(--line);
        border-radius: 14px;
        background: var(--surface);
        color: var(--ink);
        cursor: pointer;
        transition: transform .15s ease, box-shadow .15s ease, background .15s ease;
      }
      .col-tile:active { transform: scale(.98); }
      .col-tile .col-name { font-size: 16.5px; font-weight: 700; letter-spacing: .01em; }
      .col-tile .col-meta { font-size: 12.5px; color: var(--ink-soft); }
      .col-tile.active {
        background: var(--ink);
        border-color: var(--ink);
        color: var(--bg);
        box-shadow: 0 6px 16px rgba(0, 0, 0, .16);
      }
      .col-tile.active .col-meta { color: inherit; opacity: .72; }
      .col-caption {
        margin: 0 2px 10px;
        font-size: 13px;
        line-height: 1.55;
        color: var(--ink-soft);
      }

      .screen-banner {
        border: 1px dashed var(--accent);
        background: var(--bad-bg);
        color: var(--ink);
        border-radius: var(--radius);
        padding: 14px 16px;
        margin-bottom: 14px;
        font-size: 14.5px;
      }
      .screen-banner .sb-title { font-weight: 700; margin-bottom: 4px; }
      .screen-banner .sb-sub { color: var(--ink-soft); font-size: 13.5px; margin-bottom: 10px; }
      .screen-banner .sb-btn {
        appearance: none;
        border: 1px solid color-mix(in srgb, var(--accent) 78%, rgba(0, 0, 0, .22));
        background: var(--accent);
        box-shadow:
          0 7px 16px color-mix(in srgb, var(--accent) 26%, transparent),
          inset 0 1px 0 rgba(255, 255, 255, .28),
          inset 0 -2px 0 rgba(0, 0, 0, .14);
        text-shadow: 0 1px 1px rgba(0, 0, 0, .14);
        color: var(--accent-ink);
        font: inherit;
        font-size: 14.5px;
        font-weight: 600;
        padding: 10px 20px;
        border-radius: 11px;
        cursor: pointer;
      }
      .screen-banner .sb-btn.ghost {
        background: transparent;
        color: var(--ink-soft);
        border: 1px solid var(--line);
        margin-left: 8px;
        box-shadow: none;
        text-shadow: none;
      }
      .pass-dots { display: inline-flex; gap: 6px; margin-left: 8px; vertical-align: middle; }
      .pass-dots i {
        width: 9px; height: 9px; border-radius: 50%;
        background: var(--surface-2); border: 1px solid var(--line); display: inline-block;
      }
      .pass-dots i.cur { background: var(--accent); border-color: var(--accent); }
      .pass-dots i.done { background: var(--good); border-color: var(--good); }

      .screen-done {
        border: 1px solid var(--line);
        background: var(--surface);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        padding: 16px;
        margin-bottom: 14px;
        font-size: 14.5px;
      }
      .screen-done .sd-title { font-weight: 700; margin-bottom: 6px; }
      .screen-done .sd-line { color: var(--ink-soft); font-size: 13.5px; }
      .screen-done .sd-line b { color: var(--ink); }

      /* flashcard */
      .card-scene { perspective: 1400px; margin-bottom: 12px; position: relative; }
      .shuffle-stage { position: absolute; inset: 0; z-index: 6; }
      .mini-card {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 108px;
        height: 152px;
        border-radius: 10px;
        background:
          repeating-linear-gradient(45deg, rgba(255, 255, 255, .22) 0 5px, transparent 5px 11px),
          repeating-linear-gradient(-45deg, rgba(255, 255, 255, .22) 0 5px, transparent 5px 11px),
          var(--accent);
        box-shadow: inset 0 0 0 5px #fbf9f3, inset 0 0 0 7px rgba(0, 0, 0, .18), 0 6px 16px rgba(0, 0, 0, .28);
        will-change: transform;
      }
      .card {
        position: relative;
        width: 100%;
        height: 300px;
        transform-style: preserve-3d;
        transition: transform .55s cubic-bezier(.2,.7,.3,1);
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
      }
      .card.flipped { transform: rotateY(180deg); }
      .card-face {
        position: absolute;
        inset: 0;
        backface-visibility: hidden;
        -webkit-backface-visibility: hidden;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 24px 22px;
        text-align: center;
        overflow: hidden;
      }
      .card-face.back {
        transform: rotateY(180deg);
        justify-content: flex-start;
        padding-top: 26px;
        overflow-y: auto;
        overflow-x: hidden;
        scrollbar-width: none;
        -webkit-overflow-scrolling: touch;
      }
      .card-face.back::-webkit-scrollbar { width: 0; height: 0; display: none; }
      .card-scroll-track {
        position: absolute;
        top: 20%;
        right: 7px;
        width: 5px;
        height: 60%;
        transform: rotateY(180deg);
        backface-visibility: hidden;
        -webkit-backface-visibility: hidden;
        pointer-events: none;
        z-index: 3;
      }
      .card-scroll-thumb {
        position: absolute;
        left: 0;
        width: 100%;
        background: var(--ink-faint);
        border-radius: 99px;
      }
      .card-tag { position: absolute; top: 14px; left: 16px; font-size: 12px; color: var(--ink-faint); letter-spacing: .06em; }
      .card-status {
        position: absolute;
        top: 12px;
        right: 14px;
        font-size: 12px;
        font-weight: 600;
        padding: 3px 10px;
        border-radius: 99px;
        display: none;
      }
      .card-status.know { display: inline-block; background: var(--good-bg); color: var(--good); }
      .card-status.unknow { display: inline-block; background: var(--bad-bg); color: var(--bad); }
      .card-status.due { display: inline-block; background: var(--gold-bg); color: var(--gold); }
      .word {
        font-family: Georgia, "Times New Roman", "Songti SC", serif;
        font-size: clamp(34px, 9vw, 46px);
        font-weight: 700;
        line-height: 1.15;
        word-break: break-word;
      }
      .word.small { font-size: clamp(24px, 6.5vw, 34px); }
      .phonetic {
        margin-top: 10px;
        font-family: "Lucida Sans Unicode", "Segoe UI", "Noto Sans", sans-serif;
        font-size: clamp(16px, 4.4vw, 20px);
        letter-spacing: .02em;
        color: var(--ink-soft);
      }
      .back-phonetic {
        font-family: "Lucida Sans Unicode", "Segoe UI", "Noto Sans", sans-serif;
        font-size: 15px;
        letter-spacing: .02em;
        color: var(--ink-faint);
        margin-bottom: 10px;
      }
      .fan-phon {
        display: block;
        margin-top: 7px;
        font-family: "Lucida Sans Unicode", "Segoe UI", "Noto Sans", sans-serif;
        font-size: 10.5px;
        font-weight: 400;
        line-height: 1.35;
        color: var(--ink-soft);
      }
      .w-phon {
        margin-left: 9px;
        font-family: "Lucida Sans Unicode", "Segoe UI", "Noto Sans", sans-serif;
        font-size: 13.5px;
        color: var(--ink-faint);
      }
      .opt-phon {
        margin-left: 10px;
        font-family: "Lucida Sans Unicode", "Segoe UI", "Noto Sans", sans-serif;
        font-size: 13px;
        color: var(--ink-faint);
      }
      .tap-hint { margin-top: 16px; font-size: 13px; color: var(--ink-faint); }
      .due-hint { margin-top: 8px; font-size: 12.5px; color: var(--gold); font-weight: 600; }
      .back-word { font-family: Georgia, "Times New Roman", serif; font-size: 21px; font-weight: 700; margin-bottom: 6px; }
      .meaning { font-size: 20px; font-weight: 600; margin-bottom: 14px; }
      .meaning-block { margin-top: 16px; max-width: 92%; }
      .meaning-block .meaning { margin-bottom: 0; }
      .meaning-hidden {
        font-size: 13.5px;
        color: var(--ink-faint);
        border: 1px dashed var(--line);
        border-radius: 10px;
        padding: 9px 16px;
      }
      .phrase-label { font-size: 11.5px; letter-spacing: .12em; color: var(--ink-faint); margin-bottom: 3px; }
      .phrase {
        font-family: Georgia, "Times New Roman", serif;
        font-style: italic;
        font-size: 15.5px;
        color: var(--ink-soft);
        margin-bottom: 14px;
        max-width: 92%;
      }
      .hook {
        font-size: 14.5px;
        color: var(--gold);
        background: var(--gold-bg);
        border-radius: 10px;
        padding: 8px 14px;
        max-width: 92%;
      }
      .card-flag {
        display: none;
        font-size: 12px;
        font-weight: 700;
        color: var(--bad);
        background: var(--bad-bg);
        border-radius: 99px;
        padding: 3px 12px;
        margin-bottom: 12px;
      }
      .card-flag.show { display: inline-block; }

      .nav-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
      .nav-btn {
        appearance: none;
        font: inherit;
        font-size: 15px;
        padding: 10px 18px;
        border-radius: 99px;
        cursor: pointer;
        min-width: 92px;
        color: var(--ink);
        -webkit-tap-highlight-color: transparent;
        border: 1px solid rgba(255, 255, 255, 0.35);
        background: linear-gradient(160deg, rgba(255, 255, 255, 0.22), rgba(255, 255, 255, 0.03) 60%);
        backdrop-filter: blur(14px) saturate(1.6);
        -webkit-backdrop-filter: blur(14px) saturate(1.6);
        box-shadow:
          0 8px 20px var(--glass-shadow-soft),
          0 2px 6px var(--glass-shadow-soft),
          inset 0 1px 0 var(--glass-hi),
          inset 0 -1px 0 rgba(0, 0, 0, 0.05);
        transition: transform .16s ease, box-shadow .16s ease, opacity .16s ease;
      }
      .nav-btn:disabled { opacity: .4; cursor: default; }
      @media (hover: hover) {
        .nav-btn:not(:disabled):hover {
          transform: translateY(-1px);
          box-shadow:
            0 14px 28px var(--glass-shadow-soft),
            0 5px 10px var(--glass-shadow-soft),
            inset 0 1px 0 var(--glass-hi),
            inset 0 -1px 0 rgba(0, 0, 0, 0.07);
        }
      }
      .nav-btn:not(:disabled):active {
        transform: translateY(1px) scale(.98);
        box-shadow:
          0 3px 8px var(--glass-shadow-soft),
          inset 0 1px 0 var(--glass-hi),
          inset 0 2px 5px rgba(0, 0, 0, 0.10);
      }
      .pos { font-size: 14px; color: var(--ink-soft); white-space: nowrap; }
      .mark-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
      .mark-btn {
        appearance: none;
        font: inherit;
        font-size: 16px;
        font-weight: 600;
        padding: 13px 10px;
        border-radius: 14px;
        cursor: pointer;
        position: relative;
        overflow: hidden;
        isolation: isolate;
        border: 1px solid rgba(255, 255, 255, 0.45);
        backdrop-filter: blur(12px) saturate(1.5);
        -webkit-backdrop-filter: blur(12px) saturate(1.5);
        box-shadow:
          0 14px 28px var(--glass-shadow),
          0 4px 8px var(--glass-shadow-soft),
          inset 0 1px 0 var(--glass-hi),
          inset 0 -1px 0 rgba(0, 0, 0, 0.08),
          inset 0 0 18px rgba(255, 255, 255, 0.10);
        transition: transform .16s ease, box-shadow .16s ease;
      }
      .mark-btn::before {
        content: "";
        position: absolute;
        inset: 0;
        z-index: -1;
        background: linear-gradient(118deg,
          rgba(255, 255, 255, 0.55) 0%,
          rgba(255, 255, 255, 0.14) 38%,
          rgba(255, 255, 255, 0) 58%);
        pointer-events: none;
      }
      .mark-btn.know {
        background: linear-gradient(165deg, rgba(255, 255, 255, 0.42), rgba(255, 255, 255, 0.06) 60%),
          color-mix(in srgb, var(--good-bg) 68%, transparent);
        color: var(--good);
        border-color: color-mix(in srgb, var(--good) 42%, rgba(255, 255, 255, 0.55));
        text-shadow: 0 1px 0 rgba(255, 255, 255, 0.35);
      }
      .mark-btn.unknow {
        background: linear-gradient(165deg, rgba(255, 255, 255, 0.42), rgba(255, 255, 255, 0.06) 60%),
          color-mix(in srgb, var(--bad-bg) 68%, transparent);
        color: var(--bad);
        border-color: color-mix(in srgb, var(--bad) 42%, rgba(255, 255, 255, 0.55));
        text-shadow: 0 1px 0 rgba(255, 255, 255, 0.35);
      }
      @media (hover: hover) {
        .mark-btn:hover {
          transform: translateY(-2px);
          box-shadow:
            0 20px 36px var(--glass-shadow),
            0 6px 12px var(--glass-shadow-soft),
            inset 0 1px 0 var(--glass-hi),
            inset 0 -1px 0 rgba(0, 0, 0, 0.08),
            inset 0 0 18px rgba(255, 255, 255, 0.14);
        }
      }
      .mark-btn:active {
        transform: translateY(2px) scale(.99);
        box-shadow:
          0 4px 10px var(--glass-shadow-soft),
          0 1px 3px var(--glass-shadow-soft),
          inset 0 1px 0 var(--glass-hi),
          inset 0 2px 6px rgba(0, 0, 0, 0.10);
      }
      .tool-row { display: flex; gap: 8px; flex-wrap: wrap; }
      .tool-btn {
        appearance: none;
        border: 1px solid var(--line);
        background: transparent;
        color: var(--ink-soft);
        font: inherit;
        font-size: 13.5px;
        padding: 8px 14px;
        border-radius: 99px;
        cursor: pointer;
      }
      .tool-btn.on { background: var(--surface-2); color: var(--ink); font-weight: 600; }
      .tool-btn:disabled { opacity: .45; cursor: default; }
      .tool-btn.danger {
        color: var(--bad);
        border-color: color-mix(in srgb, var(--bad) 45%, var(--line));
        font-weight: 600;
      }

      .clear-confirm {
        border: 2px solid var(--bad);
        background: var(--bad-bg);
        border-radius: 14px;
        padding: 16px;
        margin-bottom: 12px;
        box-shadow: 0 10px 24px color-mix(in srgb, var(--bad) 18%, transparent);
      }
      .clear-confirm-title {
        font-size: 19px;
        font-weight: 800;
        line-height: 1.3;
        color: var(--bad);
        margin-bottom: 8px;
      }
      .clear-confirm-text {
        margin: 0 0 14px;
        font-size: 15px;
        line-height: 1.6;
        color: var(--ink);
      }
      .clear-confirm-text b { color: var(--bad); font-size: 17px; }
      .clear-confirm-actions { display: grid; grid-template-columns: 1fr 1.25fr; gap: 10px; }

      .fan-card {

          repeating-linear-gradient(-45deg, rgba(255, 255, 255, .22) 0 5px, transparent 5px 11px),

      .fan-card.center { border-color: var(--accent); color: var(--ink); z-index: 3; }
      @keyframes fan-in {

        to { transform: rotate(var(--r, 0deg)) translateY(var(--ty, 0px)); opacity: 1; }
      }
      button.fan-zone {

        transition: transform .32s cubic-bezier(.25,.9,.3,1);
      }
      button.fan-zone.dragging { transition: none; }
      button.fan-zone:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; border-radius: 12px; }
      .fan-card.swap {

          transform .54s cubic-bezier(.28,.84,.3,1),

      .brand { text-align: center; margin: 14px 0 22px; }
      .brand h1 {

      .brand-rule::before,

      .brand-rule::after {
        background: linear-gradient(90deg, var(--line), transparent);

      /* Brand splash — same as the main version */
      .splash {
        position: fixed;
        inset: 0;
        z-index: 80;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 10px;
        padding: 24px 16px calc(24px + env(safe-area-inset-bottom, 0px));
        background:
          radial-gradient(120% 90% at 50% 38%, rgba(255, 214, 170, .10), rgba(70, 16, 8, .26) 80%),
          #b3382c;
        border: 0;
        font: inherit;
        color: #f4f2ec;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
        opacity: 1;
        transition: opacity .45s ease;
      }
      .splash-map { position: absolute; inset: 0; display: block; pointer-events: none; }
      .splash-map svg { display: block; width: 100%; height: 100%; }
      .splash-map .draw {
        fill: none;
        stroke: #f4f2ec;
        stroke-width: 1.6;
        stroke-linecap: round;
        stroke-dasharray: 100;
        stroke-dashoffset: 100;
        animation: splash-draw 1.4s cubic-bezier(.4, 0, .3, 1) forwards;
      }
      .splash-map .draw.frame { stroke-width: 1.4; opacity: .5; }
      .splash-map .draw.frame-inner { stroke-width: 1; opacity: .3; animation-delay: .15s; }
      .splash-map .draw.trail { stroke-width: 2; opacity: .48; animation-duration: 1.7s; animation-delay: .35s; }
      .splash-map .fade-el { opacity: 0; animation: splash-ink-in .7s ease forwards; }
      .splash-map .ring {
        fill: none;
        stroke: #f4f2ec;
        stroke-width: 1.4;
        stroke-dasharray: 4 5;
        opacity: 0;
      }
      .splash-map .compass { fill: rgba(244, 242, 236, .18); stroke: #f4f2ec; stroke-width: 1.4; stroke-linejoin: round; }
      .splash-map .compass-dot { fill: #f4f2ec; }
      .splash-map .x-mark { fill: none; stroke: #f4f2ec; stroke-width: 2.4; stroke-linecap: round; }
      .splash-map .prints ellipse {
        fill: #f4f2ec;
        opacity: 0;
        animation: splash-print-in .5s ease forwards;
      }
      @keyframes splash-draw { to { stroke-dashoffset: 0; } }
      @keyframes splash-ink-in { from { opacity: 0; } to { opacity: .75; } }
      @keyframes splash-print-in { from { opacity: 0; } to { opacity: .6; } }
      .splash.leaving { opacity: 0; pointer-events: none; }
      .splash:focus-visible { outline: 2px solid #f4f2ec; outline-offset: -4px; }
      .splash .brand-rule::before { background: linear-gradient(90deg, transparent, rgba(244, 242, 236, .75)); }
      .splash .brand-rule::after { background: linear-gradient(90deg, rgba(244, 242, 236, .75), transparent); }
      .splash .brand-rule span { background: #f4f2ec; }
      .splash .splash-hint { color: rgba(244, 242, 236, .72); }
      .splash-brand { position: relative; z-index: 1; display: block; text-align: center; animation: splash-rise .8s cubic-bezier(.2,.7,.3,1) .45s backwards; }
      .splash-title {
        display: block;
        font-family: "Playfair Display", Georgia, "Times New Roman", serif;
        font-size: clamp(38px, 10.5vw, 52px);
        font-weight: 900;
        line-height: 1.12;

      }
      .splash-hint {
        position: absolute;
        z-index: 1;
        left: 0;
        right: 0;
        bottom: calc(26px + env(safe-area-inset-bottom, 0px));
        text-align: center;
        font-size: 12.5px;
        letter-spacing: .18em;
        color: var(--ink-faint);
        animation: splash-rise .8s ease 1s backwards;
      }
      @keyframes splash-rise {
        from { opacity: 0; transform: translateY(12px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .glass-card {

        display: flex; align-items: center; justify-content: center;
      }

        appearance: none; font: inherit; cursor: pointer;

      .extract-status .es-title { font-size: 17px; font-weight: 700; margin-bottom: 6px; }
      .extract-status .es-sub { font-size: 13.5px; color: var(--ink-soft); line-height: 1.6; margin: 0; }
      .group-input {
        appearance: none;
        font: inherit;
        width: 100%;
        padding: 11px 14px;
        border: 1px solid var(--line);

        color: var(--ink);

        font-weight: 600;

      }
      .draft-list { display: grid; gap: 10px; margin-bottom: 14px; }
      .draft-item {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 14px;
        box-shadow: var(--shadow);

      }
      .draft-top { display: flex; align-items: baseline; gap: 4px; margin-bottom: 4px; }
      .draft-word { font-family: Georgia, "Times New Roman", serif; font-size: 20px; font-weight: 700; word-break: break-word; }
      .draft-del {
        margin-left: auto; flex: none;

        background: transparent; border: 1px solid color-mix(in srgb, var(--bad) 45%, var(--line));
        color: var(--bad); font-size: 12.5px; font-weight: 600;

      .draft-meaning { font-size: 16.5px; font-weight: 600; margin-bottom: 10px; }
      .draft-phrase {
        font-family: Georgia, "Times New Roman", serif;
        font-style: italic;
        font-size: 14.5px;

        margin-bottom: 10px;

      @media (prefers-reduced-motion: reduce) {
        .wake-spinner { animation: none; }
      }

      .view-study-pad { padding-top: 44px; }
      .back-glass {
        appearance: none;
        position: fixed;
        top: calc(10px + env(safe-area-inset-top, 0px));
        left: calc(12px + env(safe-area-inset-left, 0px));
        z-index: 60;
        display: none;
        align-items: center;
        justify-content: center;
        width: 34px;
        height: 34px;
        padding: 0;
        color: var(--ink);
        border-radius: 50%;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
        border: 1px solid rgba(255, 255, 255, 0.35);
        background: linear-gradient(160deg, rgba(255, 255, 255, 0.22), rgba(255, 255, 255, 0.03) 60%);
        backdrop-filter: blur(14px) saturate(1.6);
        -webkit-backdrop-filter: blur(14px) saturate(1.6);
        box-shadow:
          0 8px 20px var(--glass-shadow-soft),
          0 2px 6px var(--glass-shadow-soft),
          inset 0 1px 0 var(--glass-hi),
          inset 0 -1px 0 rgba(0, 0, 0, 0.05);

      }
      .back-glass.show { display: inline-flex; }
      @keyframes back-fade { from { opacity: 0; } to { opacity: 1; } }
      .back-glass svg { display: block; }
      @media (hover: hover) {
        .back-glass:hover {
          transform: translateY(-1px);
          box-shadow:
            0 14px 28px var(--glass-shadow-soft),
            0 5px 10px var(--glass-shadow-soft),
            inset 0 1px 0 var(--glass-hi),
            inset 0 -1px 0 rgba(0, 0, 0, 0.07);

      }
      .back-glass:active {
        transform: translateY(1px) scale(.98);
        box-shadow:
          0 3px 8px var(--glass-shadow-soft),
          inset 0 1px 0 var(--glass-hi),
          inset 0 2px 5px rgba(0, 0, 0, 0.10);

      @keyframes home-rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
      .home-flow > * { animation: home-rise .5s cubic-bezier(.22,.75,.3,1) both; }
      .home-flow > *:nth-child(2) { animation-delay: .06s; }
      .home-flow > *:nth-child(3) { animation-delay: .12s; }
      .home-flow > *:nth-child(4) { animation-delay: .18s; }

      .home-flow > *:nth-child(7) { animation-delay: .36s; }

      @keyframes view-in-right { from { opacity: 0; transform: translateX(18px); } to { opacity: 1; transform: translateX(0); } }
      @keyframes view-in-left { from { opacity: 0; transform: translateX(-18px); } to { opacity: 1; transform: translateX(0); } }
      @keyframes view-in-soft { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
      .view-enter { animation: view-in-right .38s cubic-bezier(.22,.75,.3,1) both; }
      .view-enter-back { animation: view-in-left .38s cubic-bezier(.22,.75,.3,1) both; }
      .view-enter-soft { animation: view-in-soft .26s ease-out both; }

      @media (prefers-reduced-motion: reduce) {
        .card { transition: none; }
        .back-glass { transition: none; animation: none; }
        .nav-btn { transition: none; }
        .bar .seg-know, .bar .seg-unknow { transition: none; }
        .fan-card { animation: none; }
        .fan-card.swap { transition: none; }
        button.fan-zone { transition: none; }
        .mini-bar span { transition: none; }
        .wanted-item { transition: none; }
        .home-flow > * { animation: none; }
        .view-enter, .view-enter-back, .view-enter-soft { animation: none; }
        .splash { transition: none; }
        .splash-brand, .splash-hint { animation: none; }
        .splash-map .draw { animation: none; stroke-dashoffset: 0; }
        .splash-map .fade-el { animation: none; opacity: .75; }
        .splash-map .prints ellipse { animation: none; opacity: .6; }
      }
    </style>
  </head>
  <body>
    <div id="splashRoot"></div>
    <button class="back-glass" id="backBtn" type="button" aria-label="返回首页">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M14.8 5.2 8.1 12l6.7 6.8" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
    <div class="mwc-wrap" id="app"></div>

    <script>
      "use strict";
      /* ===== 20 sample words — 示例词 (replaced set, verbatim) ===== */
      var WORDS = [
        {id:1, word:"sanction", phon:"ˈsæŋkʃn", meaning:"制裁；批准", example:"The UN imposed sanctions on the country.", hook:"神圣的裁决，可以是惩罚也可以是许可", trap:"两个意思完全相反，看上下文", group:"sample"},
        {id:2, word:"oversight", phon:"ˈəʊvəsaɪt", meaning:"疏忽；监督", example:"It was a mere oversight.", hook:"over（上）+ sight（看），在上面看着 = 监督，看漏了 = 疏忽", trap:"一词两义", group:"sample"},
        {id:3, word:"peruse", phon:"pəˈruːz", meaning:"细读", example:"He perused the contract carefully before signing.", hook:"per-（完全）+ use（用），仔仔细细地用眼 → 细读", trap:"不是“粗略浏览”，恰恰相反", group:"sample"},
        {id:4, word:"enormity", phon:"ɪˈnɔːməti", meaning:"巨大；罪大恶极", example:"They were shocked by the enormity of the disaster.", hook:"e-（出）+ norm（标准），超出标准 → 巨大；大到犯罪的程度 → 罪大恶极", trap:"别只记“巨大”，正式语境常指“骇人听闻”", group:"sample"},
        {id:5, word:"unleash", phon:"ʌnˈliːʃ", meaning:"释放", example:"The new policy unleashed the creativity of young people.", hook:"un-（解开）+ leash（狗链），解开链子放出来", group:"sample"},
        {id:6, word:"ecosystem", phon:"ˈiːkəʊsɪstəm", meaning:"生态系统", example:"Protecting the forest ecosystem is vital.", hook:"eco-（生态）+ system（系统）", group:"sample"},
        {id:7, word:"contemporary", phon:"kənˈtempərəri", meaning:"当代的", example:"She is one of the greatest contemporary writers.", hook:"con-（共同）+ tempor（时间），和我们同一时间的 → 当代的", group:"sample"},
        {id:8, word:"pessimism", phon:"ˈpesɪmɪzəm", meaning:"悲观", example:"His pessimism about the economy proved wrong.", hook:"pess-（坏）+ -ism，总往坏处想", group:"sample"},
        {id:9, word:"relentless", phon:"rɪˈlentləs", meaning:"不懈的；无情的", example:"She pursued her goal with relentless determination.", hook:"relent（缓和）+ -less，毫不缓和 → 不懈的", group:"sample"},
        {id:10, word:"mindset", phon:"ˈmaɪndset", meaning:"思维模式", example:"A growth mindset helps you learn from failure.", hook:"mind（脑）+ set（定型），脑子里定型的想法", group:"sample"},
        {id:11, word:"tenure", phon:"ˈtenjə(r)", meaning:"任期；终身教职", example:"He was granted tenure after six years of teaching.", hook:"ten-（持有），保住职位 → 终身教职；任期", group:"sample"},
        {id:12, word:"artifact", phon:"ˈɑːtɪfækt", meaning:"人工制品；文物", example:"The museum displays artifacts from ancient Egypt.", hook:"art-（人工）+ fact（做），人造的东西", group:"sample"},
        {id:13, word:"take a toll on", phon:"teɪk ə təʊl ɒn", meaning:"对……造成损害", example:"Lack of sleep takes a toll on your health.", hook:"toll 是“通行费”，健康在交费", group:"sample"},
        {id:14, word:"get by", phon:"ɡet baɪ", meaning:"勉强度日；应付过去", example:"We can get by on a small budget.", hook:"get（过）+ by（过去），凑合着过下去", group:"sample"},
        {id:15, word:"refrain from", phon:"rɪˈfreɪn frəm", meaning:"克制；避免", example:"Please refrain from smoking here.", hook:"re-（回）+ frain（刹住），把自己刹住 → 克制", group:"sample"},
        {id:16, word:"cognitive bias", phon:"ˈkɒɡnətɪv ˈbaɪəs", meaning:"认知偏差", example:"Confirmation bias is a common cognitive bias.", hook:"cognitive（认知的）+ bias（偏见），大脑自带的偏见", group:"sample"},
        {id:17, word:"inflammable", phon:"ɪnˈflæməbl", meaning:"易燃的", example:"Petrol is highly inflammable.", hook:"in-（进入）+ flamm（火焰），一点就着", trap:"in- 在这里不是否定，inflammable = flammable（易燃的）", group:"sample"},
        {id:18, word:"susceptible (to)", phon:"səˈseptəbl", meaning:"易受……影响的", example:"Children are more susceptible to colds.", hook:"sus-（下面）+ cept（接受），从下面接住 → 容易中招", trap:"后面固定接 to", group:"sample"},
        {id:19, word:"yield", phon:"jiːld", meaning:"产出；屈服", example:"The field yields 500 kg of wheat per year.", hook:"产量义最常考", trap:"文中是“产量”就别写“屈服”", group:"sample"},
        {id:20, word:"infringe", phon:"ɪnˈfrɪndʒ", meaning:"侵犯", example:"Copying the book would infringe copyright.", hook:"in-（进入）+ fring（边缘），踩过界 → 侵犯", group:"sample"}
      ];

      /* ===== Groups & collections — one sample group「示例词」 ===== */
      var GROUPS = [
        { key: "sample", label: "示例词", tag: "示例词" }
      ];
      var COLLECTIONS = [];
      var LADDER = [1, 2, 4, 7, 15, 30];
      var LAST_STAGE = LADDER.length - 1;

      /* ===== Dates (Asia/Shanghai, same as the main version) ===== */
      function todayStr() {
        try {
          return new Intl.DateTimeFormat("en-CA", { timeZone: "Asia/Shanghai" }).format(new Date());
        } catch (e) {
          var d = new Date();
          function p(n){ return (n < 10 ? "0" : "") + n; }
          return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate());
        }
      }
      function addDays(dateStr, days) {
        var d = new Date(dateStr + "T00:00:00Z");
        d.setUTCDate(d.getUTCDate() + days);
        return d.toISOString().slice(0, 10);
      }
      var TODAY = todayStr();

      /* ===== Progress persistence — the visitor's own browser (localStorage) =====
         Marks, ladder stage, due dates and fail streaks are saved on this
         device only, so a refresh keeps the review progress. */
      var LS_KEY = "mwc-trial-progress-v1";
      var store = { progress: {}, backup: null, profile: null };
      function loadStore() {
        try {
          var raw = window.localStorage.getItem(LS_KEY);
          if (!raw) return;
          var parsed = JSON.parse(raw);
          if (parsed && typeof parsed === "object") {
            if (parsed.progress && typeof parsed.progress === "object") store.progress = parsed.progress;
            if (parsed.backup !== undefined) store.backup = parsed.backup;
            if (parsed.profile && typeof parsed.profile === "object") store.profile = parsed.profile;
          }
        } catch (e) { /* storage unavailable: run in-memory only */ }
      }
      function saveStore() {
        try {
          window.localStorage.setItem(LS_KEY, JSON.stringify(store));
        } catch (e) { /* storage unavailable: keep in-memory state */ }
      }
      loadStore();

      function prog(word) {
        if (!store.progress[word]) store.progress[word] = { mark: null, stage: null, dueOn: null, failStreak: 0 };
        return store.progress[word];
      }
      function markOf(word) { var p = store.progress[word]; return p ? p.mark : null; }
      function isScheduled(word) { var p = store.progress[word]; return !!(p && p.dueOn != null); }
      function isDue(word) { var p = store.progress[word]; return !!(p && p.dueOn != null && p.dueOn <= TODAY); }

      /* ===== Helpers ===== */
      function $(id) { return document.getElementById(id); }
      function esc(s) {
        return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
      }
      function shuffleArr(a) {
        var arr = a.slice();
        for (var i = arr.length - 1; i > 0; i--) {
          var j = Math.floor(Math.random() * (i + 1));
          var t = arr[i]; arr[i] = arr[j]; arr[j] = t;
        }
        return arr;
      }
      function groupTag(key) {
        for (var i = 0; i < GROUPS.length; i++) if (GROUPS[i].key === key) return GROUPS[i].tag;
        return key;
      }
      function groupLabel(key) {
        for (var i = 0; i < GROUPS.length; i++) if (GROUPS[i].key === key) return GROUPS[i].label;
        return key;
      }
      function wordByName(name) {
        for (var i = 0; i < WORDS.length; i++) if (WORDS[i].word === name) return WORDS[i];
        return null;
      }
      function reducedMotion() {
        return typeof window !== "undefined" && window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      }
      function blankedPhrase(item) {
        var re = new RegExp(item.word.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "i");
        if (re.test(item.example)) return item.example.replace(re, "______");
        return "（结合释义选出对应的词）";
      }

      /* ===== View / study state (mirrors the main version) ===== */
      var view = store.profile ? "home" : "onboarding"; // home | study | extract | onboarding (first visit, before a profile is saved)
      var viewAnim = 0;
      var mode = "cards";              // cards | quiz
      var modeAnim = 0;
      var group = "all";
      var collection = "all";
      var srcOpen = false;
      var onlyUnknow = false;
      var deckKind = "normal";         // normal | review
      var reviewList = [];
      var curWord = null;
      var order = null;
      var flipped = false;
      var meaningShown = false;
      var screen = null;               // {pass, deckWords, passMarks, clean, recovered}
      var screenSummary = null;        // {clean, recovered, failedWords}
      var quiz = null;                 // {order, i, correct, answered, locked, picked, options}
      var confirmClear = false;
      var restoreNote = null;
      var shuffling = false;
      var switching = false;
      var touchX = null;

      /* ===== Photo extract state (trial backend) ===== */
      var API_BASE = "https://muggle-word-cards-api.onrender.com";
      var exStage = "pick";            // pick | compressing | extracting | draft | importing | done
      var exFiles = [];                // [{file, url}]
      var exGroupLabel = "";
      var exDraft = [];                // normalized draft words the user kept
      var exError = "";
      var exResult = null;             // {groupLabel, imported, skipped}
      var exElapsedTimer = null;
      var exStartedAt = 0;

      function activeCollection() {
        for (var i = 0; i < COLLECTIONS.length; i++) if (COLLECTIONS[i].key === collection) return COLLECTIONS[i];
        return null;
      }
      function groupWords() {
        var col = activeCollection();
        return WORDS.filter(function (x) {
          if (col && col.groups.indexOf(x.group) === -1) return false;
          return group === "all" || x.group === group;
        });
      }
      function visibleGroups() {
        var col = activeCollection();
        if (!col) return GROUPS.filter(function (g) { return WORDS.some(function (w) { return w.group === g.key; }); });
        return GROUPS.filter(function (g) { return col.groups.indexOf(g.key) !== -1 && WORDS.some(function (w) { return w.group === g.key; }); });
      }
      function counts() {
        var know = 0, unknow = 0, due = 0, unscheduled = 0;
        WORDS.forEach(function (w) {
          var m = markOf(w.word);
          if (m === "know") know++;
          else if (m === "unknow") unknow++;
          if (isDue(w.word)) due++;
          if (!isScheduled(w.word)) unscheduled++;
        });
        return { know: know, unknow: unknow, due: due, unscheduled: unscheduled, marked: know + unknow };
      }
      function clearedScheduledCount() {
        var n = 0;
        WORDS.forEach(function (w) {
          var p = store.progress[w.word];
          if (markOf(w.word) === null && isScheduled(w.word) && p && p.stage != null) n++;
        });
        return n;
      }
      function wantedList() {
        var list = [];
        WORDS.forEach(function (w) {
          var p = store.progress[w.word];
          if (p && p.failStreak >= 2) list.push({ p: p, item: w });
        });
        list.sort(function (a, b) { return b.p.failStreak - a.p.failStreak; });
        return list;
      }
      function baseList() {
        if (screen) {
          return screen.deckWords.map(wordByName).filter(Boolean);
        }
        if (deckKind === "review") {
          return reviewList.map(wordByName).filter(Boolean);
        }
        var list = groupWords();
        if (onlyUnknow) list = list.filter(function (x) { return markOf(x.word) === "unknow"; });
        return list;
      }
      function deck() {
        var base = baseList();
        if (!order) return base;
        var rank = {};
        order.forEach(function (w, i) { rank[w] = i; });
        return base.slice().sort(function (a, b) {
          var ra = rank[a.word] != null ? rank[a.word] : 9999;
          var rb = rank[b.word] != null ? rank[b.word] : 9999;
          return ra - rb;
        });
      }
      function deckIdx(d) {
        if (d.length === 0) return 0;
        for (var i = 0; i < d.length; i++) if (d[i].word === curWord) return i;
        return 0;
      }
      function unscheduledInScope() {
        return groupWords().filter(function (x) { return !isScheduled(x.word); });
      }

      /* ===== Splash (same intro as the main version) ===== */
      var splashLeaving = false, splashGone = false, splashTimers = [];
      function dismissSplash() {
        if (splashLeaving || splashGone) return;
        splashTimers.forEach(clearTimeout); splashTimers = [];
        splashLeaving = true; renderSplash();
        splashTimers.push(setTimeout(function () { splashGone = true; renderSplash(); }, 480));
      }
      function renderSplash() {
        var root = $("splashRoot");
        if (splashGone) { root.innerHTML = ""; return; }
        root.innerHTML =
          '<button type="button" class="splash' + (splashLeaving ? " leaving" : "") + '" id="splashBtn" aria-label="Muggle Word Cards — 点任意处进入">' +
            '<span class="splash-map" aria-hidden="true"><svg viewBox="0 0 400 800" preserveAspectRatio="xMidYMid slice" focusable="false">' +
              '<rect class="draw frame" x="18" y="18" width="364" height="764" pathLength="100" />' +
              '<rect class="draw frame-inner" x="30" y="30" width="340" height="740" pathLength="100" />' +
              '<path class="draw trail" pathLength="100" d="M 56 692 C 110 640, 84 574, 142 522 C 196 474, 300 478, 322 408 C 340 350, 236 322, 218 264 C 202 214, 262 148, 330 118" />' +
              '<circle class="fade-el ring" cx="312" cy="622" r="34" style="animation-delay:1s" />' +
              '<circle class="fade-el ring" cx="84" cy="206" r="21" style="animation-delay:1.15s" />' +
              '<g class="fade-el" style="animation-delay:1.25s"><path class="compass" d="M 322 82 L 330 108 L 356 116 L 330 124 L 322 150 L 314 124 L 288 116 L 314 108 Z" /><circle class="compass-dot" cx="322" cy="116" r="4" /></g>' +
              '<g class="fade-el" style="animation-delay:1.35s"><path class="x-mark" d="M 66 622 L 90 646 M 90 622 L 66 646" /></g>' +
              '<g class="prints">' +
                '<ellipse cx="62" cy="684" rx="5" ry="9" transform="rotate(-32 62 684)" style="animation-delay:.55s" />' +
                '<ellipse cx="82" cy="672" rx="5" ry="9" transform="rotate(-18 82 672)" style="animation-delay:.7s" />' +
                '<ellipse cx="94" cy="648" rx="5" ry="9" transform="rotate(6 94 648)" style="animation-delay:.85s" />' +
                '<ellipse cx="112" cy="632" rx="5" ry="9" transform="rotate(24 112 632)" style="animation-delay:1s" />' +
                '<ellipse cx="112" cy="606" rx="5" ry="9" transform="rotate(38 112 606)" style="animation-delay:1.15s" />' +

      /* ===== Home fan ===== */
      var FAN_ROT = [-26, -12, 0, 12, 26];
      var FAN_LIFT = [0, 0, -10, 0, 0];
      var fanCenter = 0, fanSwap = null, fanDragX = 0, fanDragging = false;
      var fanPointer = null, fanSuppressClick = false;
      var FAN_SWAP_MS = 540;
      function modN(a, n) { return ((a % n) + n) % n; }
      function fanFont(w) { return w.length > 10 ? "12.5px" : w.length > 8 ? "14px" : undefined; }
      function cycleFan(dir) {
        var n = WORDS.length;

        var centerIdx = modN(fanCenter, n);

        var outgoing = WORDS[centerIdx];
        if (!reducedMotion()) {
          if (fanSwap || !incoming || !outgoing) return;
          fanSwap = { incoming: incoming.word, outgoing: outgoing.word };

        if (zone.getAttribute("data-built") !== "1") {

            html += '<div class="fan-card swap offfan" data-fan="' + i + '" aria-hidden="true" style="z-index:0"><span class="fan-word"></span><span class="fan-phon" style="display:none"></span></div>';
          });

        }
        var defs = [
          { off: -2, kind: "pattern" }, { off: -1, kind: "word" }, { off: 0, kind: "cover" },
          { off: 1, kind: "word" }, { off: 2, kind: "pattern" }

        var slotOf = {};
        defs.forEach(function (d, s) { slotOf[modN(centerIdx + d.off, n)] = { slot: s, kind: d.kind }; });

        for (var i = 0; i < els.length; i++) {
          var el = els[i];

          var info = slotOf[wi];

          if (!info) {

          el.style.setProperty("--ty", FAN_LIFT[s] + "px");

          el.style.zIndex = String(z);

            wordSpan.textContent = "";
            phonSpan.style.display = "none";
          } else {
            wordSpan.textContent = w.word;

      /* ===== Navigation between views ===== */
      function showStudy() { view = "study"; viewAnim++; window.scrollTo(0, 0); render(); }
      function showHome() { stopExTimer(); view = "home"; viewAnim++; window.scrollTo(0, 0); render(); }
      function showExtract() { view = "extract"; viewAnim++; window.scrollTo(0, 0); render(); }

      /* ===== Card navigation (soft slide, same as the main version) ===== */
      function goToIndex(n) {
        var d = deck();
        var target = d[n];
        if (!target) return;
        curWord = target.word; flipped = false; meaningShown = false;
        renderStudyBody();
      }
      function softGo(delta) {
        var d = deck();
        var idx = deckIdx(d);
        var n = idx + delta;
        if (n < 0 || n >= d.length) return;
        var scene = $("cardScene");
        if (reducedMotion() || switching || !scene || !scene.animate) { goToIndex(n); return; }
        switching = true;
        var out = scene.animate(
          [{ opacity: 1, transform: "translateX(0px)" }, { opacity: 0, transform: "translateX(" + (-10 * delta) + "px)" }],
          { duration: 130, easing: "ease-in", fill: "forwards" }
        );
        out.onfinish = function () {
          goToIndex(n);
          var scene2 = $("cardScene");
          if (!scene2) { switching = false; return; }
          var inn = scene2.animate(
            [{ opacity: 0, transform: "translateX(" + (12 * delta) + "px)" }, { opacity: 1, transform: "translateX(0px)" }],
            { duration: 300, easing: "cubic-bezier(.22,.75,.3,1)", fill: "forwards" }
          );
          inn.onfinish = function () { switching = false; };
          setTimeout(function () { switching = false; }, 380);
        };
      }
      function tapCard() {
        if (!flipped) { flipped = true; }
        else if (!meaningShown) { meaningShown = true; }
        else { flipped = false; meaningShown = false; }
        renderStudyBody();
      }

      /* ===== Screening — tonight's three shuffled passes ===== */
      function startScreening() {
        var scope = unscheduledInScope().map(function (x) { return x.word; });
        if (scope.length === 0) return;
        screenSummary = null; deckKind = "normal"; onlyUnknow = false; order = null;
        screen = { pass: 1, deckWords: scope, passMarks: {}, clean: [], recovered: [] };
        curWord = scope[0] || null; flipped = false; meaningShown = false; mode = "cards";
        render();
      }
      function exitScreening() { screen = null; order = null; curWord = null; render(); }
      function exitScreeningSilent() { screen = null; screenSummary = null; }
      function finishPass() {
        if (!screen) return;
        var knownThisPass = screen.deckWords.filter(function (w) { return screen.passMarks[w] === "know"; });
        var unknownThisPass = screen.deckWords.filter(function (w) { return screen.passMarks[w] !== "know"; });
        var clean = screen.pass === 1 ? screen.clean.concat(knownThisPass) : screen.clean;
        var recovered = screen.pass > 1 ? screen.recovered.concat(knownThisPass) : screen.recovered;
        if (unknownThisPass.length === 0 || screen.pass >= 3) {
          var failed = screen.pass >= 3 ? unknownThisPass : [];
          var today = TODAY;
          clean.forEach(function (w) { var p = prog(w); p.mark = "know"; p.stage = 2; p.dueOn = addDays(today, LADDER[2]); p.failStreak = 0; });
          recovered.forEach(function (w) { var p = prog(w); p.mark = "know"; p.stage = 1; p.dueOn = addDays(today, LADDER[1]); p.failStreak = 0; });
          failed.forEach(function (w) { var p = prog(w); p.mark = "unknow"; p.stage = 0; p.dueOn = addDays(today, LADDER[0]); p.failStreak = 0; });
          saveStore();
          screenSummary = { clean: clean.length, recovered: recovered.length, failedWords: failed };
          screen = null; order = null; curWord = null;
          render();
          return;
        }
        var nextDeck = shuffleArr(unknownThisPass);
        screen = { pass: screen.pass + 1, deckWords: nextDeck, passMarks: {}, clean: clean, recovered: recovered };
        order = null; curWord = nextDeck[0] || null; flipped = false; meaningShown = false;
        render();
      }

      /* ===== Marking & review (ladder logic identical to the main version) ===== */
      function setMark(word, mark) { prog(word).mark = mark; saveStore(); }
      function recordReview(word, known) {
        var p = prog(word);
        if (known) { p.stage = Math.min((p.stage == null ? 0 : p.stage) + 1, LAST_STAGE); p.failStreak = 0; }
        else { p.stage = 0; p.failStreak = (p.failStreak || 0) + 1; }
        p.dueOn = addDays(TODAY, LADDER[p.stage]);
        p.mark = known ? "know" : "unknow";
        saveStore();
      }
      function applyMark(kind) {
        var d = deck(); var idx = deckIdx(d); var item = d[idx];
        if (!item) return;
        if (deckKind === "review" && !screen) { answerReview(kind === "know"); return; }
        var cur = markOf(item.word);
        var next = cur === kind ? null : kind;
        setMark(item.word, next);
        if (screen) {
          if (next) screen.passMarks[item.word] = next;
          else delete screen.passMarks[item.word];
        }
        if (!onlyUnknow && next === "know" && idx < d.length - 1) {
          renderStudyBody();
          softGo(1);
        } else {
          renderStudyBody();
        }
      }
      function answerReview(known) {
        var d = deck(); var idx = deckIdx(d); var item = d[idx];
        if (!item) return;
        var answered = item.word;
        recordReview(answered, known);
        var remaining = reviewList.filter(function (w) { return w !== answered; });
        reviewList = remaining;
        var nextWord = remaining[Math.min(idx, Math.max(remaining.length - 1, 0))] || null;
        curWord = nextWord; flipped = false; meaningShown = false;
        render();

      function startReview() {
        var due = WORDS.filter(function (x) { return isDue(x.word); }).sort(function (a, b) {
          var da = (store.progress[a.word] || {}).dueOn || "";
          var db = (store.progress[b.word] || {}).dueOn || "";

      }
      function exitReview() { deckKind = "normal"; reviewList = []; curWord = null; }

      /* ===== Shuffle — poker riffle, ported from the main version ===== */
      function doShuffle() {
        if (shuffling) return;
        var d = deck();
        var cardEl = $("cardEl"), scene = $("cardScene");
        if (reducedMotion() || d.length < 3 || !cardEl || !cardEl.animate || !scene) {
          order = shuffleArr(d.map(function (x) { return x.word; }));
          curWord = d[0] ? d[0].word : null; flipped = false; meaningShown = false;
          renderStudyBody();
          return;
        }
        shuffling = true; renderStudyBody();
        scene = $("cardScene"); cardEl = $("cardEl");
        if (!scene || !cardEl) { shuffling = false; return; }
        var stage = document.createElement("div");
        stage.className = "shuffle-stage";
        scene.appendChild(stage);
        var N = 12, minis = [], startRot = [], i, mc;
        for (i = 0; i < N; i++) {
          mc = document.createElement("div");
          mc.className = "mini-card";
          var r0 = ((i % 5) - 2) * 1.6;
          startRot.push(r0);
          mc.style.zIndex = String(i);
          mc.style.transform = "translate(-50%,-50%) rotate(" + r0 + "deg)";
          stage.appendChild(mc); minis.push(mc);

        var pileX = Math.min(78, Math.max(52, scene.clientWidth / 4 - 6));
        var pileOf = [];
        minis.forEach(function (m, j) {
          var side = j % 2 === 0 ? -1 : 1;
          var pileRot = side * (5 + (j % 3) * 1.5);

          pileOf[j] = pile;

            [{ transform: "translate(-50%,-50%) rotate(" + startRot[j] + "deg)" }, { transform: pile }],
            { duration: 240, delay: j * 12, easing: "cubic-bezier(.3,.7,.4,1)", fill: "forwards" }
          );
        });
        var riffleStart = 240 + N * 12 + 70;
        minis.forEach(function (m, j) {
          var landRot = ((j * 37) % 7) - 3;
          var landY = (N - j) * 0.8;
          m.animate(
            [{ transform: pileOf[j] || "" }, { transform: "translate(-50%, calc(-50% + " + landY + "px)) rotate(" + landRot + "deg)" }],
            { duration: 170, delay: riffleStart + j * 42, easing: "ease-in", fill: "forwards" }
          );

          else if (stage.parentNode) stage.remove();
        }, riffleEnd + 190);
      }

      /* ===== Quiz ===== */
      function quizOptions(target) {
        var others = WORDS.filter(function (x) { return x.word !== target.word; });
        var sameGroup = shuffleArr(others.filter(function (x) { return x.group === target.group; }));
        var rest = shuffleArr(others.filter(function (x) { return x.group !== target.group; }));
        return shuffleArr(sameGroup.concat(rest).slice(0, 3).concat([target]));
      }
      function startQuiz() {

        var orderQ = shuffleArr(pool);

      }
      function restartQuizFor(pool) {
        var orderQ = shuffleArr(pool);
        var first = orderQ[0];

      }
      function answerQuiz(pickedWord) {

        quiz = { order: quiz.order, i: quiz.i, correct: quiz.correct + (right ? 1 : 0), answered: quiz.answered + 1, locked: true, picked: pickedWord, options: quiz.options };
        renderStudyBody();

        if (!quiz) return;
        var ni = quiz.i + 1;

      /* ===== Group / collection picking ===== */
      function pickGroup(g) {
        group = g; exitReview(); exitScreeningSilent(); screen = null; order = null; curWord = null;

        confirmClear = false; restoreNote = null; srcOpen = false;

      /* ===== Clear / restore marks ===== */

        });

        saveStore();

        render();

      function restoreMarks() {
        var restored = 0;

      /* ===== Card-back custom scrollbar (mirrors the main version) ===== */

      /* ===== Photo extract: upload -> draft -> import (trial backend) ===== */
      function startExTimer() {
        stopExTimer();
        exStartedAt = Date.now();
        exElapsedTimer = setInterval(function () {
          var el = $("exElapsed");
          if (el) el.textContent = String(Math.floor((Date.now() - exStartedAt) / 1000));
        }, 500);
      }
      function stopExTimer() {
        if (exElapsedTimer) { clearInterval(exElapsedTimer); exElapsedTimer = null; }
      }
      function fetchWithTimeout(url, options, timeoutMs) {
        var controller = typeof AbortController !== "undefined" ? new AbortController() : null;
        var timer = null;
        if (controller) {
          options.signal = controller.signal;
          timer = setTimeout(function () { controller.abort(); }, timeoutMs);
        }
        return fetch(url, options).then(function (r) {
          if (timer) clearTimeout(timer);
          return r;
        }, function (e) {
          if (timer) clearTimeout(timer);
          throw e;
        });
      }
      function readServerError(resp) {
        return resp.json().then(function (d) {
          if (d && typeof d.detail === "string" && d.detail) return d.detail;
          return "";
        }).catch(function () { return ""; });
      }
      function exFriendlyError(err, fallback) {
        if (err && err.name === "AbortError") {
          return "等了 120 秒服务器还没有回应——它可能还在唤醒，或者网络不太稳。稍等半分钟再试一次。";
        }
        if (err && err.message && /[一-鿿]/.test(err.message) && err.message.length < 200) return err.message;
        return fallback;
      }
      function normalizeDraft(w) {
        function cleanPhon(p) { return String(p || "").trim().replace(/^\/+|\/+$/g, "").trim(); }
        return {
          word: String((w && w.word) || "").trim(),
          phonetic: cleanPhon(w && w.phonetic),
          meaning: String((w && w.meaning) || "").trim(),
          phrase: String((w && w.phrase) || "").trim(),
          hook: String((w && w.hook) || "").trim(),
          trap: String((w && w.trap) || "").trim()
        };
      }
      function resetExtract() {
        stopExTimer();
        exFiles.forEach(function (x) { if (x.url && window.URL && URL.revokeObjectURL) URL.revokeObjectURL(x.url); });
        exFiles = [];
        exDraft = [];
        exGroupLabel = "";
        exError = "";
        exResult = null;
        exStage = "pick";
      }
      function onExFilesChosen(list) {
        if (!list || list.length === 0) return;
        exError = "";
        var incoming = Array.prototype.slice.call(list);
        for (var i = 0; i < incoming.length; i++) {
          var f = incoming[i];
          if (exFiles.length >= 3) { exError = "一次最多 3 张照片，多出来的先放着，下次再拍。"; break; }
          if (!/^image\//.test(f.type || "")) { exError = "「" + f.name + "」不是图片，换一张照片试试。"; continue; }
          if (f.size > 10 * 1024 * 1024) { exError = "「" + f.name + "」超过 10MB 了，换一张小一点的照片。"; continue; }
          exFiles.push({ file: f, url: (window.URL && URL.createObjectURL) ? URL.createObjectURL(f) : "" });
        }
        renderExtract();
      }
      function removeExPhoto(idx) {
        var x = exFiles[idx];
        if (x && x.url && window.URL && URL.revokeObjectURL) URL.revokeObjectURL(x.url);
        exFiles.splice(idx, 1);
        exError = "";
        renderExtract();
      }
      function compressImageFile(file) {
        return new Promise(function (resolve) {
          var url = (window.URL && URL.createObjectURL) ? URL.createObjectURL(file) : "";
          if (!url) { resolve(file); return; }
          var img = new Image();
          img.onload = function () {
            try {
              var w = img.naturalWidth || img.width;
              var h = img.naturalHeight || img.height;
              if (!w || !h) { URL.revokeObjectURL(url); resolve(file); return; }
              var scale = Math.min(1, 1600 / Math.max(w, h));
              var cw = Math.max(1, Math.round(w * scale));
              var ch = Math.max(1, Math.round(h * scale));
              var canvas = document.createElement("canvas");
              canvas.width = cw;
              canvas.height = ch;
              var ctx = canvas.getContext("2d");
              if (!ctx) { URL.revokeObjectURL(url); resolve(file); return; }
              ctx.fillStyle = "#ffffff";
              ctx.fillRect(0, 0, cw, ch);
              ctx.drawImage(img, 0, 0, cw, ch);
              URL.revokeObjectURL(url);
              if (canvas.toBlob) {
                canvas.toBlob(function (blob) {
                  resolve(blob || file);
                }, "image/jpeg", 0.85);
              } else {
                resolve(file);
              }
            } catch (e) {
              try { URL.revokeObjectURL(url); } catch (e2) {}
              resolve(file);
            }
          };
          img.onerror = function () {
            try { URL.revokeObjectURL(url); } catch (e) {}
            resolve(file);
          };
          img.src = url;
        });
      }
      function jpegName(name, idx) {
        var base = String(name || "").replace(/\.[^.]*$/, "");
        return (base || ("photo-" + (idx + 1))) + ".jpg";
      }
      function examCodeForExtract() {
        var name = store.profile && store.profile.examName ? String(store.profile.examName) : "";
        if (name.indexOf("六级") !== -1) return "cet6";
        if (name.indexOf("四级") !== -1) return "cet4";
        if (name.indexOf("考研") !== -1) return "kaoyan";
        if (name.indexOf("雅思") !== -1) return "ielts";
        if (name.indexOf("托福") !== -1) return "toefl";
        return "cet6";
      }
      function startExtract() {
        if (exFiles.length === 0) return;
        exError = "";
        exStage = "compressing";
        renderExtract();
        startExTimer();
        var jobs = exFiles.map(function (x) { return compressImageFile(x.file); });
        Promise.all(jobs).then(function (blobs) {
          if (view !== "extract") { stopExTimer(); return; }
          exStage = "extracting";
          renderExtract();
          var fd = new FormData();
          fd.append("exam", examCodeForExtract());
          blobs.forEach(function (blob, i) {
            var orig = exFiles[i] ? exFiles[i].file : null;
            if (blob && blob !== orig) fd.append("files", blob, jpegName(orig && orig.name, i));
            else if (orig) fd.append("files", orig);
          });
          return fetchWithTimeout(API_BASE + "/api/extract", { method: "POST", body: fd }, 120000);
        }).then(function (resp) {
          if (!resp) return null;
          if (!resp.ok) {
            return readServerError(resp).then(function (m) {
              throw new Error(m || ("服务器出错了（HTTP " + resp.status + "），稍等一下再试一次。"));
            });
          }
          return resp.json();
        }).then(function (data) {
          stopExTimer();
          if (view !== "extract") return;
          var words = (data && data.words) || [];
          exDraft = words.map(normalizeDraft).filter(function (w) { return w.word && w.meaning; });
          exGroupLabel = (data && data.group_label) || "";
          if (exDraft.length === 0) {
            exStage = "pick";
            exError = "这次没有提取到合适的词，换一张拍得更清楚的照片再试试。";
          } else {
            exStage = "draft";
          }
          renderExtract();
        }).catch(function (err) {
          stopExTimer();
          if (view !== "extract") return;
          exStage = "pick";
          exError = exFriendlyError(err, "连不上试用服务器，检查一下网络再试；如果是服务器在睡觉，等半分钟再点一次。");
          renderExtract();
        });
      }
      function deleteDraft(idx) {
        exDraft.splice(idx, 1);
        exError = "";
        renderExtract();
      }
      function confirmImport() {
        var input = $("exGroupInput");
        var label = input ? input.value.trim() : exGroupLabel;
        if (exDraft.length === 0) return;
        if (!label) {
          exError = "先给这组词填一个分组名，再点确认导入。";
          renderExtract();
          return;
        }
        exGroupLabel = label;
        exError = "";
        exStage = "importing";
        renderExtract();
        startExTimer();
        var payload = {
          group_label: label,
          source: "拍照提词（试用版）",
          words: exDraft.map(function (w) {
            return { word: w.word, phonetic: w.phonetic, meaning: w.meaning, phrase: w.phrase, hook: w.hook, trap: w.trap || "" };
          })
        };
        fetchWithTimeout(API_BASE + "/api/import", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        }, 120000).then(function (resp) {
          if (!resp.ok) {
            return readServerError(resp).then(function (m) {
              throw new Error(m || ("保存失败（HTTP " + resp.status + "），稍等一下再试一次。"));
            });
          }
          return resp.json();
        }).then(function (data) {
          stopExTimer();
          if (view !== "extract") return;
          exResult = {
            groupLabel: label,
            imported: (data && typeof data.imported === "number") ? data.imported : exDraft.length,
            skipped: (data && data.skipped) || []
          };
          exStage = "done";
          renderExtract();
        }).catch(function (err) {
          stopExTimer();
          if (view !== "extract") return;
          exStage = "draft";
          exError = exFriendlyError(err, "保存没成功，词还都在这页，检查一下网络再点一次确认导入。");
          renderExtract();
        });
      }

      splashTimers = [
        setTimeout(function () { splashLeaving = true; renderSplash(); }, 3300),
        setTimeout(function () { splashGone = true; renderSplash(); }, 3780)
      ];
      render();
    </script>
  </body>
